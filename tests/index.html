<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CPU1 数值监控曲线图</title>
    <!-- 引入ECharts CDN，无需本地下载，直接使用 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        /* 给图表容器设置宽高，必须设置否则图表不显示 */
        #cpuChart {
            width: 100%;
            height: 600px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <!-- 图表渲染的容器 -->
    <div id="cpuChart"></div>

    <script>
        // 1. 你的原始数据数组
        const cpuData = [
            {"namespace": "cpu","value": 65163.14,"timestamp": 1764214446643,"tags": {"cpu": "1"}},
            {"namespace": "cpu","value": 0.0,"timestamp": 1764214447644,"tags": {"cpu": "1"}},
            {"namespace": "cpu","value": 65163.14,"timestamp": 1764214449644,"tags": {"cpu": "1"}},
            {"namespace": "cpu","value": 0.0,"timestamp": 1764214450644,"tags": {"cpu": "1"}},
            {"namespace": "cpu","value": 65163.17,"timestamp": 1764214452644,"tags": {"cpu": "1"}},
            {"namespace": "cpu","value": 0.0,"timestamp": 1764214453644,"tags": {"cpu": "1"}},
            {"namespace": "cpu","value": 65163.21,"timestamp": 1764214455644,"tags": {"cpu": "1"}},
            {"namespace": "cpu","value": 0.0,"timestamp": 1764214456644,"tags": {"cpu": "1"}},
            {"namespace": "cpu","value": 65163.24,"timestamp": 1764214458644,"tags": {"cpu": "1"}},
            {"namespace": "cpu","value": 0.0,"timestamp": 1764214459644,"tags": {"cpu": "1"}}
        ];

        // 2. 数据格式化：提取数组中的 timestamp 和 value，转为ECharts需要的二维数组格式
        // 格式要求：[[时间戳, 数值], [时间戳, 数值], ...]
        const chartData = cpuData.map(item => {
            return [item.timestamp, item.value];
        });

        // 3. 初始化ECharts实例
        const myChart = echarts.init(document.getElementById('cpuChart'));

        // 4. 图表配置项
        const option = {
            // 图表标题
            title: {
                text: 'CPU 1 数值监控曲线 (时间-数值)',
                left: 'center',
                textStyle: { fontSize: 18, fontWeight: 'normal' }
            },
            // 鼠标悬浮提示框
            tooltip: {
                trigger: 'axis',
                formatter: '时间: {b}<br/>数值: {c}',
                axisPointer: { type: 'line' }
            },
            // 图表边距
            grid: {
                left: '3%',
                right: '4%',
                bottom: '3%',
                containLabel: true
            },
            // X轴配置 - 时间轴
            xAxis: {
                type: 'time', // 声明为时间轴，自动解析时间戳
                name: '采集时间',
                nameLocation: 'middle',
                nameGap: 30,
                axisLine: { lineStyle: { color: '#333' } }
            },
            // Y轴配置 - 数值轴
            yAxis: {
                type: 'value',
                name: 'CPU对应数值',
                nameLocation: 'middle',
                nameGap: 50,
                axisLine: { lineStyle: { color: '#333' } }
            },
            // 核心：曲线图数据配置
            series: [
                {
                    name: 'CPU1 数值',
                    type: 'line', // line=曲线图，如需折线图，仅需修改配置即可
                    smooth: true, // 开启平滑曲线，如需纯折线，删掉这行即可
                    data: chartData, // 绑定格式化后的时间-数值数据
                    lineStyle: { width: 2, color: '#1677ff' }, // 线条样式：粗细、颜色
                    symbol: 'circle', // 拐点样式
                    symbolSize: 6, // 拐点大小
                    itemStyle: { color: '#1677ff' } // 拐点颜色
                }
            ]
        };

        // 5. 渲染图表
        myChart.setOption(option);

        // 自适应窗口大小变化
        window.addEventListener('resize', () => {
            myChart.resize();
        });
    </script>
</body>
</html>
